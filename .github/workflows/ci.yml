name: CI

on:
  push:
    branches: [main, modern]
  pull_request:
    branches: [main, modern]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PORTABLE_SLICE: >-
    -p cmr-core -p cmr-formats -p cmr-test-support -p cmr-assets -p cmr-video

jobs:
  portable-gate:
    name: Portable slice (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Portability and legacy-backend audits
        run: |
          ./scripts/check-portability.sh
          ./scripts/check-legacy-backends.sh
      - name: Analysis-tool bridge tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Clippy (portable slice)
        run: cargo clippy ${{ env.PORTABLE_SLICE }} --all-targets -- -D warnings
      - name: Test (portable slice)
        run: cargo test ${{ env.PORTABLE_SLICE }}

  windows-cross-check:
    name: Windows cross-check (portable slice)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Cross-check for Windows
        run: cargo check --target x86_64-pc-windows-gnu ${{ env.PORTABLE_SLICE }} --all-targets

  full-workspace:
    name: Full workspace with bundled SDL3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Install SDL3 Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libudev-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev
      - name: Clippy (full workspace, bundled SDL3)
        run: cargo clippy --workspace --all-targets --features cmr-platform-sdl3/bundled-sdl3 -- -D warnings
      - name: Test (full workspace, bundled SDL3)
        run: cargo test --workspace --features cmr-platform-sdl3/bundled-sdl3
