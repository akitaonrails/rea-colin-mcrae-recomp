name: Build Modern Release Artifacts

on:
  push:
    branches: [modern]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-artifacts:
    name: Build modern (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Resolve and validate version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cmr-app"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "tag $GITHUB_REF_NAME does not match cmr-app version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install SDL3 Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libudev-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev

      - name: Build release binaries from source
        run: cargo build --locked --release -p cmr-app -p cmr-assets --features cmr-platform-sdl3/bundled-sdl3

      - name: Audit release binary imports
        shell: bash
        env:
          CMR_REQUIRE_BINARY_INSPECTION: "1"
        run: ./scripts/check-legacy-backends.sh

      - name: Build and inspect Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .work/release dist
          curl --fail --location --silent --show-error \
            --output .work/release/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  .work/release/appimagetool' | sha256sum --check
          curl --fail --location --silent --show-error \
            --output .work/release/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  .work/release/runtime-x86_64' | sha256sum --check
          chmod +x .work/release/appimagetool
          ARTIFACT="dist/Colin-McRae-Rally-Modern-v${VERSION}-x86_64.AppImage"
          ./scripts/package-appimage.sh "$VERSION" .work/release/appimagetool .work/release/runtime-x86_64 "$ARTIFACT"
          VERSION_OUTPUT=$("$ARTIFACT" --appimage-extract-and-run --version)
          test "$VERSION_OUTPUT" = "cmr-app $VERSION"
          ASSET_VERSION_OUTPUT=$("$ARTIFACT" --appimage-extract-and-run --asset-tool --version)
          test "$ASSET_VERSION_OUTPUT" = "cmr-assets $VERSION"
          "$ARTIFACT" --appimage-extract >/dev/null
          ! find squashfs-root -type f | grep -E '/(Rally|Game)\.exe$|/qmixer\.dll$|\.(c3d|wav|bmp|pal|fon)$'
          rm -rf squashfs-root
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"

      - name: Package and inspect Windows ZIP
        if: runner.os == 'Windows'
        shell: bash
        run: |
          STAGE="dist/Colin-McRae-Rally-Modern-v${VERSION}-windows-x86_64"
          mkdir -p "$STAGE/profiles" "$STAGE/docs"
          cp target/release/cmr-app.exe "$STAGE/cmr-app-modern.exe"
          cp target/release/cmr-assets.exe "$STAGE/cmr-assets.exe"
          SDL_DLL=$(find target/release/build -type f -iname SDL3.dll -print -quit)
          test -n "$SDL_DLL"
          cp "$SDL_DLL" "$STAGE/SDL3.dll"
          cp profiles/*.json "$STAGE/profiles/"
          cp README.md CONTRIBUTING.md CHANGELOG.md packaging/RELEASE.md "$STAGE/docs/"
          python scripts/collect-third-party-licenses.py "$STAGE/docs/third-party-licenses"
          VERSION_OUTPUT=$("$STAGE/cmr-app-modern.exe" --version)
          test "$VERSION_OUTPUT" = "cmr-app $VERSION"
          ASSET_VERSION_OUTPUT=$("$STAGE/cmr-assets.exe" --version)
          test "$ASSET_VERSION_OUTPUT" = "cmr-assets $VERSION"
          ! find "$STAGE" -type f | grep -E '/(Rally|Game)\.exe$|/qmixer\.dll$|\.(c3d|wav|bmp|pal|fon)$'
          (cd dist && 7z a -tzip "Colin-McRae-Rally-Modern-v${VERSION}-windows-x86_64.zip" "$(basename "$STAGE")")
          rm -rf "$STAGE"
          (cd dist && sha256sum "Colin-McRae-Rally-Modern-v${VERSION}-windows-x86_64.zip" > "Colin-McRae-Rally-Modern-v${VERSION}-windows-x86_64.zip.sha256")

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmr-modern-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact-tag artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check ./*.sha256
          sha256sum ./*.AppImage ./*.zip > SHA256SUMS.txt
          cd ..
          VERSION=${GITHUB_REF_NAME#v}
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 {emit=1; next} /^## \[/{if (emit) exit} emit' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Colin McRae Rally Modern $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release-artifacts/*.AppImage \
            release-artifacts/*.zip \
            release-artifacts/SHA256SUMS.txt
